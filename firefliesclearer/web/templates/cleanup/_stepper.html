<nav class="wizard-stepper" aria-label="Cleanup steps">
  <ol>
    <li class="step{% if step == 'filter' %} active{% endif %}" data-step="filter">1. Filter</li>
    <li class="step{% if step == 'review' %} active{% endif %}" data-step="review">2. Review</li>
    {% if show_trash_step|default(false) %}
      <li class="step{% if step == 'trash' %} active{% endif %}" data-step="trash">3a. Trash</li>
      <li class="step{% if step == 'archive' %} active{% endif %}" data-step="archive">3b. Archive</li>
    {% else %}
      <li class="step{% if step == 'archive' %} active{% endif %}" data-step="archive">3. Archive</li>
    {% endif %}
    <li class="step{% if step == 'purge' %} active{% endif %}" data-step="purge">4. Purge</li>
  </ol>
</nav>
