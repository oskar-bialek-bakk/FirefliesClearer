name: CI

on:
  push:
    branches: [main, "version/**"]
  pull_request:
    branches: [main, "version/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check (strict on core/application/web)
        run: mypy --strict firefliesclearer/core firefliesclearer/application firefliesclearer/web
      - name: Type check (full)
        run: mypy firefliesclearer
      - name: Import boundary check
        run: lint-imports
      - name: Tests with coverage gate
        run: pytest -q --cov=firefliesclearer --cov-report=term --cov-fail-under=85
